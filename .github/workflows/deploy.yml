name: Build and Deploy Blazor WASM to GitHub Pages

on:
  push:
    branches: [ "main" ] # Change to "master" if your default branch is master
  workflow_dispatch: # Also allows a manual run from the Actions tab

permissions:
  contents: read

# One deployment at a time: pushes in quick succession queue up instead of failing with
# "in progress deployment". Only the newest waiting run is kept; a running one is not cancelled.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x # The project targets net10.0

      - name: Publish .NET App
        # The run number becomes the patch version (1.0.<run>), see Directory.Build.props
        run: dotnet publish CheckYourLanguage/CheckYourLanguage.csproj -c Release -o release -p:BuildNumber=${{ github.run_number }}

      # Uploaded here rather than in the deploy job: with ~50 MB of recordings the artifact takes a
      # moment to be registered, and a deploy started right after the upload in the same job failed
      # with "No artifacts named github-pages were found".
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: release/wwwroot

  # Publishes to https://kreaton.github.io/CheckYourLanguage/ (Settings > Pages > Source: GitHub Actions).
  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
